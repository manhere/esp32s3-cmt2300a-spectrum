; CMT2300A 频谱扫描器 - 宽频遥控器频率探测仪
; ESP32-S3 N16R8 + CMT2300A + PlatformIO + Arduino
;
; 硬件连接：
;   CMT2300A CSB(pin5)  -> GPIO4    寄存器片选
;   CMT2300A FCSB(pin2) -> GPIO5    FIFO片选
;   CMT2300A SCK(pin8)  -> GPIO6    时钟
;   CMT2300A MOSI(pin6) -> GPIO7    数据(双向SDIO)
;   CMT2300A MISO(pin7) -> GPIO8    3线模式未用
;   CMT2300A GPIO1(pin9)-> GPIO10
;
; 用法：
;   pio run                 编译
;   pio run -t upload       烧录
;   pio device monitor      串口日志(115200)

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; ---- N16R8: 16MB QIO Flash + 8MB OPI PSRAM ----
board_build.flash_size          = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

; ---- ESPAsyncWebServer + WebSocket + ArduinoJson ----
lib_compat_mode = strict
lib_ldf_mode    = chain
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson
	ayushsharma82/ElegantOTA

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCMT2300A_DEBUG=0
    ; AsyncTCP 与扫频任务 scanTask 在 core1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
